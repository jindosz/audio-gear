# main 브랜치에 푸시하면 GitHub 서버가 앱을 빌드해서 GitHub Pages에 올린다.
# 저장소 Settings → Pages → Source를 "GitHub Actions"로 한 번 설정해 두어야 한다
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: # Actions 탭에서 손으로 다시 배포할 수도 있게

permissions:
  contents: read
  pages: write
  id-token: write

# 배포가 겹치면 앞의 것을 기다리지 않고 최신 것만 올린다
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
