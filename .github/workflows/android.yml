# 안드로이드 앱(audio-gear-0.1.<빌드 번호>.apk)을 GitHub 서버에서 빌드하고, 저장소 Releases의 "android-latest"에 올린다.
# 서명 키는 저장소 Settings → Secrets and variables → Actions에 넣어 둔 값 4개를 쓴다(docs/android-install.md).
# 폰에서는 Releases 페이지에서 APK를 받아 설치한다. 같은 키로 서명되므로 지우지 않고 덮어써 업데이트된다.
name: Android app

on:
  push:
    # main: 배포용. claude/**: 합치기 전에 작업 브랜치에서 APK를 미리 만들어 폰에서 확인하려고
    branches: [main, 'claude/**']
    paths:
      - 'src/**'
      - 'android/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'capacitor.config.ts'
      - '.github/workflows/android.yml'
  workflow_dispatch: # Actions 탭(또는 Claude)이 손으로 실행할 수도 있게

permissions:
  contents: write # Releases에 APK를 올리려면 필요

# 브랜치마다 따로 줄을 세운다(작업 브랜치 빌드가 main 빌드를 취소하지 않게)
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # 웹 코드를 안드로이드용(상대 경로, 서비스 워커 없음)으로 빌드하고 android/ 안에 넣는다
      - run: npm run build:android
        env:
          # 앱 설정 화면 맨 아래에 보이는 빌드 번호·커밋(src/buildInfo.ts)
          VITE_BUILD_NUMBER: ${{ github.run_number }}
          VITE_COMMIT: ${{ github.sha }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: 서명 키 준비
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::키스토어 Secrets가 없습니다. docs/android-install.md의 1번을 보고 저장소 Secrets에 4개를 넣어 주세요."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: APK 빌드(서명)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ./gradlew testReleaseUnitTest assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/audio-gear-0.1.$VERSION_CODE.apk"

      # 파일 이름에 버전이 들어가 매번 달라지므로, 올리기 전에 그 릴리스의 이전 APK를 지운다(처음이면 릴리스가 없어 건너뜀)
      - name: 이전 APK 지우기
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref == 'refs/heads/main' && 'android-latest' || 'android-preview' }}
        run: |
          for name in $(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep '\.apk$' || true); do
            gh release delete-asset "$TAG" "$name" --repo "$GITHUB_REPOSITORY" -y
          done

      # main: 정식 설치 링크(android-latest). 설치 안내 문서가 가리키는 곳
      - if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: audio-gear 안드로이드 앱 0.1.${{ github.run_number }} (빌드 ${{ github.run_number }})
          prerelease: false
          make_latest: true
          target_commitish: ${{ github.sha }}
          body: |
            audio-gear 안드로이드 앱 최신 빌드입니다. 아래 audio-gear-0.1.${{ github.run_number }}.apk를 폰에서 받아 설치하세요.
            처음 설치·데이터 옮기기 안내: docs/android-install.md
            버전: 0.1.${{ github.run_number }} (빌드 ${{ github.run_number }}) · 커밋: ${{ github.sha }}
          files: audio-gear-0.1.${{ github.run_number }}.apk

      # 작업 브랜치: 합치기 전 미리 보기(android-preview). 정식 링크를 덮어쓰지 않는다
      - if: github.ref != 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-preview
          name: audio-gear 안드로이드 앱 미리 보기 0.1.${{ github.run_number }} (빌드 ${{ github.run_number }})
          prerelease: true
          make_latest: false
          target_commitish: ${{ github.sha }}
          body: |
            main에 합치기 전 작업 브랜치(${{ github.ref_name }})의 시험 빌드입니다. 확인용으로만 설치하세요.
            버전: 0.1.${{ github.run_number }} (빌드 ${{ github.run_number }}) · 커밋: ${{ github.sha }}
          files: audio-gear-0.1.${{ github.run_number }}.apk
