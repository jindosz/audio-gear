# EQ 시험 앱(android-spike)을 GitHub 서버에서 APK로 빌드하고, 저장소 Releases의 "eq-spike"에 올린다.
# 폰 브라우저로 Releases 페이지를 열어 APK를 받아 설치하면 된다(PC에 Android Studio가 없어도 됨).
name: Android EQ spike

on:
  push:
    paths:
      - 'android-spike/**'
      - '.github/workflows/android-spike.yml'
  workflow_dispatch:

permissions:
  contents: write # Releases에 APK를 올리려면 필요

concurrency:
  group: android-spike
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-spike
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew assembleDebug --no-daemon
      - run: cp app/build/outputs/apk/debug/app-debug.apk eq-spike.apk
      - uses: actions/upload-artifact@v4
        with:
          name: eq-spike-apk
          path: android-spike/eq-spike.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: eq-spike
          name: EQ 시험 앱 (스파이크)
          prerelease: true
          target_commitish: ${{ github.sha }}
          body: |
            폰 전체 소리에 EQ가 걸리는지 확인하는 시험 앱입니다.
            아래 eq-spike.apk를 폰에서 받아 설치하세요. 새 버전은 이전 버전을 지우고 설치해야 합니다(빌드마다 서명이 다름).
            빌드한 커밋: ${{ github.sha }}
          files: android-spike/eq-spike.apk
